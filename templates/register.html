<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register | QueueFlow AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins',sans-serif;

            min-height:100vh;

            background:linear-gradient(135deg,#0f172a,#2563eb);

            display:flex;

            justify-content:center;

            align-items:center;

            padding:30px;

        }

        .register-box{

            width:100%;
            max-width:500px;

            background:white;

            border-radius:18px;

            padding:40px;

            box-shadow:0 20px 45px rgba(0,0,0,.25);

            animation:fadeIn .6s ease;

        }

        @keyframes fadeIn{

            from{

                opacity:0;
                transform:translateY(25px);

            }

            to{

                opacity:1;
                transform:translateY(0);

            }

        }

        .logo{

            text-align:center;

            margin-bottom:25px;

        }

        .logo h1{

            font-size:42px;

            margin-bottom:10px;

        }

        .logo h2{

            color:#0d6efd;

            font-weight:700;

        }

        .logo p{

            color:#6c757d;

            margin-top:5px;

        }

        .form-label{

            font-weight:600;

        }

        .form-control{

            height:48px;

            border-radius:10px;

        }

        .btn-register{

            height:48px;

            border-radius:10px;

            font-size:17px;

            font-weight:600;

        }

        .input-group-text{

            background:white;

        }

        .login-link{

            text-align:center;

            margin-top:20px;

        }

        .login-link a{

            text-decoration:none;

            font-weight:600;

        }

        .footer{

            margin-top:25px;

            text-align:center;

            color:#6c757d;

            font-size:14px;

        }

        .alert{

            border-radius:10px;

        }

    </style>

</head>

<body>

<div class="register-box">

    <div class="logo">

        <h1>🚀</h1>

        <h2>QueueFlow AI</h2>

        <p>Create your account</p>

    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}

    <div class="alert alert-{{ category }}">
        {{ message }}
    </div>

    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">

                Full Name

            </label>

            <input
                type="text"
                name="fullname"
                class="form-control"
                placeholder="Enter your full name"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Email

            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Password

            </label>

            <div class="input-group">

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Create password"
                    required>

                <button
                    class="btn btn-outline-secondary"
                    type="button"
                    onclick="togglePassword('password','icon1')">

                    <i class="bi bi-eye" id="icon1"></i>

                </button>

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">

                Confirm Password

            </label>

            <div class="input-group">

                <input
                    type="password"
                    class="form-control"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required>

                <button
                    class="btn btn-outline-secondary"
                    type="button"
                    onclick="togglePassword('confirm_password','icon2')">

                    <i class="bi bi-eye" id="icon2"></i>

                </button>

            </div>

        </div>

        <button
            type="submit"
            class="btn btn-primary w-100 btn-register">

            Register

        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a href="{{ url_for('login') }}">

            Login

        </a>

    </div>

    <div class="footer">

        © 2026 <strong>QueueFlow AI</strong><br>

        Developed by <strong>Saish Kadam</strong>

    </div>

</div>

<script>

function togglePassword(id,icon){

    const field=document.getElementById(id);

    const eye=document.getElementById(icon);

    if(field.type==="password"){

        field.type="text";

        eye.classList.remove("bi-eye");

        eye.classList.add("bi-eye-slash");

    }

    else{

        field.type="password";

        eye.classList.remove("bi-eye-slash");

        eye.classList.add("bi-eye");

    }

}

</script>

</body>

</html>
