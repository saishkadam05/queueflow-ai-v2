<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Change Password</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card mx-auto" style="max-width:500px;">

<div class="card-header bg-primary text-white">

<h3>🔒 Change Password</h3>

</div>

<div class="card-body">

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}
<div class="alert alert-{{ category }}">
{{ message }}
</div>
{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<div class="mb-3">

    <label>Current Password</label>

    <div class="input-group">

        <input
            type="password"
            name="current_password"
            class="form-control"
            id="current_password"
            required>

        <button
            class="btn btn-outline-secondary"
            type="button"
            onclick="togglePassword('current_password','icon1')">

            <i class="bi bi-eye" id="icon1"></i>

        </button>

    </div>

</div>

<div class="mb-3">

    <label>New Password</label>

    <div class="input-group">

        <input
            type="password"
            name="new_password"
            class="form-control"
            id="new_password"
            required>

        <button
            class="btn btn-outline-secondary"
            type="button"
            onclick="togglePassword('new_password','icon2')">

            <i class="bi bi-eye" id="icon2"></i>

        </button>

    </div>

</div>

<div class="mb-3">

    <label>Confirm Password</label>

    <div class="input-group">

        <input
            type="password"
            name="confirm_password"
            class="form-control"
            id="confirm_password"
            required>

        <button
            class="btn btn-outline-secondary"
            type="button"
            onclick="togglePassword('confirm_password','icon3')">

            <i class="bi bi-eye" id="icon3"></i>

        </button>

    </div>

</div>

<button class="btn btn-primary w-100">
Update Password
</button>

</form>

<hr>

<a href="{{ url_for('profile') }}"
class="btn btn-secondary w-100">

← Back to Profile

</a>

</div>

</div>

</div>

<footer class="text-center text-secondary mt-5 mb-3">
    <hr class="border-secondary">
    <small>
        © 2026 <strong>QueueFlow AI</strong> | Developed by <strong>Saish Kadam</strong>
    </small>
</footer>

<script>

function togglePassword(inputId, iconId){

    const password = document.getElementById(inputId);
    const icon = document.getElementById(iconId);

    if(password.type === "password"){

        password.type = "text";

        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");

    }else{

        password.type = "password";

        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");

    }

}

</script>

</body>

</html>
